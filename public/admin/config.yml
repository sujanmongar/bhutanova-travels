# Sveltia CMS — https://github.com/sveltia/sveltia-cms
# Sign in with GitHub (or a GitHub personal access token). Every save commits to the repo
# and Cloudflare Pages rebuilds the site automatically (~1 min).
backend:
  name: github
  repo: sujanmongar/bhutanova-travels
  branch: main
  # For "Sign in with GitHub" set base_url to your sveltia-cms-auth worker URL (see README).
  # base_url: https://sveltia-cms-auth.<you>.workers.dev

site_url: https://bhutanova-travels.pages.dev
media_folder: public/images/uploads
public_folder: /images/uploads

# Tip: image fields accept an upload, any image URL, or an Unsplash id like "photo-1578556881786-851d4b79cb73".

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: excerpt, label: Excerpt (SEO description), widget: text }
      - { name: image, label: Cover image, widget: image }
      - { name: date, label: Publish date, widget: datetime, time_format: false, format: YYYY-MM-DD }
      - { name: author, label: Author, widget: string, default: Bhutanova Travels }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: Draft (hidden), widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown }

  - name: guides
    label: Travel Guide
    label_singular: Guide
    folder: src/content/guides
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: excerpt, label: Excerpt, widget: text }
      - { name: image, label: Cover image, widget: image }
      - { name: group, label: Section, widget: select, options: ["Plan & Book", "Entry & Visa", "Money & Costs", "On the Ground"] }
      - { name: order, label: Order, widget: number, value_type: int, default: 99 }
      - { name: updated, label: Last reviewed, widget: datetime, time_format: false, format: YYYY-MM-DD }
      - { name: body, label: Body, widget: markdown }

  - name: tours
    label: Tour Packages
    label_singular: Tour
    folder: src/content/tours
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{nights}}N/{{days}}D — USD {{price}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: category, label: Category, widget: relation, collection: categories, value_field: "{{slug}}", search_fields: [menuTitle], display_fields: [menuTitle] }
      - { name: featured, label: Show on homepage, widget: boolean, default: false }
      - { name: nights, label: Nights, widget: number, value_type: int }
      - { name: days, label: Days, widget: number, value_type: int }
      - { name: route, label: "Route (e.g. Paro (2N))", widget: list }
      - { name: price, label: Price from (USD per person), widget: number, value_type: int }
      - { name: priceNotes, label: Price notes, widget: list, required: false }
      - { name: summary, label: Overview, widget: text }
      - { name: image, label: Card image, widget: image }
      - { name: gallery, label: Gallery, widget: image, multiple: true, required: false }
      - { name: highlights, label: Highlights, widget: list, required: false }
      - name: itinerary
        label: Itinerary
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - { name: title, label: Day title, widget: string }
          - { name: image, label: Image, widget: image, required: false }
          - { name: body, label: "Description (blank line = new paragraph, '- ' = bullet)", widget: text }
          - { name: overnight, label: Overnight, widget: string, required: false }
      - { name: inclusions, label: Inclusions, widget: list, required: false }
      - { name: exclusions, label: Exclusions, widget: list, required: false }
      - { name: map, label: Route map image, widget: image, required: false }

  - name: categories
    label: Tour Categories
    label_singular: Category
    folder: src/content/categories
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Page title, widget: string }
      - { name: menuTitle, label: Menu title, widget: string }
      - { name: image, label: Image, widget: image }
      - { name: excerpt, label: Short description, widget: text }
      - { name: order, label: Order, widget: number, value_type: int, default: 99 }
      - { name: body, label: Intro text, widget: markdown }

  - name: site
    label: Site Data
    files:
      - name: news
        label: News Ticker
        file: src/data/news.json
        fields:
          - { name: items, label: News items, widget: list, fields: [{ name: text, label: Text, widget: string }, { name: url, label: Link, widget: string }] }
      - name: faqs
        label: FAQs
        file: src/data/faqs.json
        fields:
          - { name: items, label: Questions, widget: list, summary: "{{fields.q}}", fields: [{ name: q, label: Question, widget: string }, { name: a, label: Answer, widget: text }] }
      - name: reviews
        label: Reviews
        file: src/data/reviews.json
        fields:
          - name: items
            label: Reviews
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: place, label: Location, widget: string }
              - { name: text, label: Review, widget: text }
              - { name: rating, label: Rating, widget: number, value_type: int, min: 1, max: 5, default: 5 }
