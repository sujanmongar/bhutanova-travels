# Rebuilds and deploys to Cloudflare Pages on every push to main, on every Sanity publish (webhook → workflow_dispatch)
# and once a day, so build-date content (next festivals, the form's months, the copyright year) never goes stale.
# One-time setup: add repo secrets CLOUDFLARE_API_TOKEN (template "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *' # 00:30 UTC = 06:30 in Bhutan
# One deploy at a time: a burst of CMS publishes queues up, and only the newest waiting run goes next, so the live
# site always ends on the latest content (an older run can't finish last and overwrite it).
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=bhutanova-travels --branch=main
